[package]
name = "helios"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "helios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librespot-oauth = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tauri-plugin-window-state = "2"
cpal = "0.16" # audio visualizer: reads what Windows is playing (loopback)

# Same versions Tauri already uses on Windows; used to trim WebView2 memory while minimized, and for the memory
# budget (mem.rs), which reads and trims the working sets of the app's processes.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s" # smaller binary = less code in memory; the Rust side is I/O-bound, not compute-bound
panic = "abort"
strip = true
