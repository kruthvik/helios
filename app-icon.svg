<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Helios app icon: a warm sun setting behind three lines of lyrics (the top one brightest, like the line
       being sung). Few bold shapes so it still reads at 16-32 px. Regenerate every size with:
       bun tauri icon app-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ff9a3c" />
      <stop offset="0.55" stop-color="#f4573a" />
      <stop offset="1" stop-color="#c8243c" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sun" cx="0.42" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#fffaf0" />
      <stop offset="1" stop-color="#ffd2a0" />
    </radialGradient>
    <radialGradient id="glow" r="0.5">
      <stop offset="0.55" stop-color="#ffe2b8" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffe2b8" stop-opacity="0" />
    </radialGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="224" /></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#bg)" />
    <rect x="64" y="64" width="896" height="896" fill="url(#sheen)" />
    <circle cx="512" cy="468" r="330" fill="url(#glow)" />
    <circle cx="512" cy="468" r="214" fill="url(#sun)" />
    <g fill="#2b0b12">
      <rect x="252" y="560" width="520" height="58" rx="29" />
      <rect x="312" y="662" width="400" height="58" rx="29" opacity="0.82" />
      <rect x="382" y="764" width="260" height="58" rx="29" opacity="0.6" />
    </g>
  </g>
</svg>
